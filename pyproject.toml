[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-aware-coding-agent"
version = "0.1.0"
description = "A memory-aware coding agent runtime with tool orchestration and context compaction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "Pillow>=10.0.0",
    "typing_extensions>=4.12.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
coding-agent = "final_version_app.cli:main"

[tool.setuptools.packages.find]
include = ["final_version_app*"]
